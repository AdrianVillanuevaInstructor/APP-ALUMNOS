<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#6C4AB6" />

<!-- Soporte iOS -->
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Student Control">

<title>Student Control 2.6</title>
<link rel="icon" href="favicon.ico" type="image/png">

<style>
/* ---- TODO TU CSS ORIGINAL (NO MODIFICADO) ---- */
:root {
--primary:#5D2E80;
--secondary:#334155;
--accent:#5D2E80;
--bg:#f4f6f9;
--text:#ffffff;
--info-text:#5CC6D0;
}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background-color:var(--bg);display:flex;min-height:100vh;overflow:auto;}
#login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--primary);display:flex;justify-content:center;align-items:center;z-index:1000;}
.login-card{background:white;padding:40px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.2);text-align:center;width:100%;max-width:350px;}
.login-card h2{color:var(--primary);margin-bottom:20px;}
.login-card input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;}
.login-card button{width:100%;padding:12px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}
.sidebar{width:260px;background:var(--primary);color:white;padding:20px;display:none;flex-direction:column;}
.sidebar h2{font-size:1.2rem;border-bottom:1px solid var(--secondary);padding-bottom:15px;margin-bottom:20px;text-align:center;}
.sidebar button{width:100%;margin:8px 0;padding:12px 15px;border:none;background:var(--secondary);color:white;cursor:pointer;text-align:left;border-radius:8px;transition:0.3s;font-size:0.9rem;}
.sidebar button:hover{background:var(--accent);}
.sidebar .logout{margin-top:auto;background:#00e0e7;margin-bottom:20px;}
.content{flex:1;padding:40px;overflow-y:auto;display:none;}
#seccionTitulo{text-align:center;margin-bottom:20px;font-size:2rem;letter-spacing:0.02em;color:var(--info-text);}
.mobile-menu-btn{display:none;position:fixed;top:16px;left:16px;z-index:1200;background:var(--accent);color:white;border:none;border-radius:8px;padding:10px 14px;font-size:1.1rem;cursor:pointer;}
@media(max-width:900px){
.sidebar{position:fixed;inset:0 0 auto 0;width:250px;transform:translateX(-100%);transition:transform 0.2s ease;z-index:1100;min-height:100vh;}
.sidebar.open{transform:translateX(0);display:flex;}
.content{width:100%;padding:20px;margin-left:0;padding-top:70px;}
.mobile-menu-btn{display:block;}
}
.loader{border:4px solid #f3f3f3;border-top:4px solid var(--accent);border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;display:none;margin:10px auto;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
<div class="login-card">
<h2>Acceso Alumnos</h2>
<input type="email" id="emailInput" placeholder="Email registrado">
<input type="password" id="passwordInput" placeholder="Contraseña">
<button onclick="intentarLogin()" id="btnLogin">Ingresar</button>
<div class="loader" id="loader"></div>
<p id="errorMsg" style="color:#ef4444;font-size:0.8rem;margin-top:10px;display:none;">Credenciales incorrectas.</p>
</div>
</div>

<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
<h2>Portal Alumno</h2>
<button onclick="mostrarSeccion('Alumno')">👤 Mis Datos</button>
<button onclick="mostrarSeccion('Asistencias')">📅 Asistencias</button>
<button onclick="mostrarSeccion('Practicas')">🧪 Prácticas</button>
<button onclick="mostrarSeccion('Recuperaciones')">🔄 Recuperaciones</button>
<button onclick="mostrarSeccion('Abono')">💰 Mis Pagos</button>
<button class="logout" onclick="location.reload()">Cerrar Sesión</button>
</div>

<div class="content" id="contenido">
<h1 id="seccionTitulo">Bienvenido</h1>
<div id="datosCuerpo"></div>
</div>

<!-- BOTÓN ANDROID -->
<button id="instalarBtn" style="
display:none;
position:fixed;
bottom:20px;
right:20px;
padding:12px 20px;
background:#007bff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
z-index:9999;">
Instalar App
</button>

<!-- POPUP iOS -->
<div id="iosPopup" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:10000;
justify-content:center;
align-items:center;">
<div style="
background:white;
width:90%;
max-width:400px;
padding:25px;
border-radius:16px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);">
<h3 style="margin-top:0;color:#5D2E80;">Instalar Student Control</h3>
<p style="font-size:14px;">
1️⃣ Toca el botón <b>Compartir</b><br><br>
2️⃣ Selecciona <b>"Agregar a pantalla de inicio"</b>
</p>
<button onclick="cerrarIosPopup()" style="
margin-top:15px;
padding:10px 20px;
border:none;
background:#5D2E80;
color:white;
border-radius:8px;">
Entendido
</button>
</div>
</div>

<script>
/* SERVICE WORKER */
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("/service-worker.js");
});
}

/* DETECTORES */
function esAndroid(){return /android/i.test(navigator.userAgent);}
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function estaInstalada(){
return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}

/* ANDROID */
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
if(estaInstalada()) return;
deferredPrompt=e;
if(esAndroid()){
document.getElementById("instalarBtn").style.display="block";
}
});
document.getElementById("instalarBtn").addEventListener("click",async()=>{
if(!deferredPrompt) return;
deferredPrompt.prompt();
});

/* iOS */
window.addEventListener("load",()=>{
if(esIOS() && !estaInstalada()){
setTimeout(()=>{
document.getElementById("iosPopup").style.display="flex";
},2000);
}
});
function cerrarIosPopup(){
document.getElementById("iosPopup").style.display="none";
}
</script>



</body>
</html>
