<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Control 2.6</title>
    <link rel="icon" href="favicon.ico" type="image/png">
    <style>
        :root {
            --primary: #5D2E80;
            --secondary: #334155;
            --accent: #5D2E80;
            --bg: #f4f6f9;
            --text: #ffffff;
            --info-text: #5CC6D0;
        }

        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); display: flex; min-height: 100vh; overflow: auto; }

        /* Pantalla de Login */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center; width: 100%; max-width: 350px;
        }
        .login-card h2 { color: var(--primary); margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }
        .login-card button {
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        /* App Layout */
        .sidebar { width: 260px; background: var(--primary); color: white; padding: 20px; display: none; flex-direction: column; }
        .sidebar h2 { font-size: 1.2rem; border-bottom: 1px solid var(--secondary); padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .sidebar button {
            width: 100%; margin: 8px 0; padding: 12px 15px; border: none; background: var(--secondary);
            color: white; cursor: pointer; text-align: left; border-radius: 8px; transition: 0.3s; font-size: 0.9rem;
        }
        .sidebar button:hover { background: var(--accent); }
        .sidebar .logout { margin-top: auto; background: #00e0e7; margin-bottom: 20px; }

        .content { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        #seccionTitulo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 0.02em;
            color: var(--info-text);
        }
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1200;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .deck-card {
            background: white;
            border: 1px solid #dbe4f5;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.08);
            text-align: center;
        }
        .deck-title {
            margin: 0 0 20px;
            font-size: 1.2rem;
            color: var(--info-text);
            text-align: center;
            font-weight: bold;
        }

        /* Mini tarjetas para cuotas en Abono */
        .mini-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }
        .mini-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80px;
        }
        .mini-card:hover { transform: translateY(-3px); border-color: var(--info-text); }
        
        .mini-card h4 {
            margin: 0 0 5px 0;
            font-size: 0.75rem;
            color: var(--info-text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .mini-card .cuota-valor {
            font-size: 1rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .mini-card .venc-valor {
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 4px;
            margin-top: 4px;
        }

        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .info-item { margin-bottom: 10px; text-align: center; }
        .info-item label { display: block; font-size: 0.75rem; color: var(--info-text); font-weight: bold; text-transform: uppercase; }
        .info-item span { font-size: 1rem; color: #1e293b; font-weight: 500; }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed; inset: 0 0 auto 0; width: 250px; transform: translateX(-100%);
                transition: transform 0.2s ease; z-index: 1100; min-height: 100vh;
            }
            .sidebar.open { transform: translateX(0); display: flex; }
            .content { width: 100%; padding: 20px; margin-left: 0; padding-top: 70px; }
            .mobile-menu-btn { display: block; }
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>Acceso Alumnos</h2>
            <input type="email" id="emailInput" placeholder="Email registrado">
            <input type="password" id="passwordInput" placeholder="Contraseña">
            <button onclick="intentarLogin()" id="btnLogin">Ingresar</button>
            <div class="loader" id="loader"></div>
            <p id="errorMsg" style="color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none;">Credenciales incorrectas.</p>
        </div>
    </div>

    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()">☰</button>
    <div class="sidebar" id="sidebar">
        <h2>Portal Alumno</h2>
        <button onclick="mostrarSeccion('Alumno')">👤 Mis Datos</button>
        <button onclick="mostrarSeccion('Asistencias')">📅 Asistencias</button>
        <button onclick="mostrarSeccion('Practicas')">🧪 Prácticas</button>
        <button onclick="mostrarSeccion('Recuperaciones')">🔄 Recuperaciones</button>
        <button onclick="mostrarSeccion('Abono')">💰 Mis Pagos</button>
        <button class="logout" onclick="location.reload()">Cerrar Sesión</button>
    </div>

    <div class="content" id="contenido">
        <h1 id="seccionTitulo">Bienvenido</h1>
        <div id="datosCuerpo"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZlly9kkBOJE2kAl0xgTQTflWrEggTcghjD30otGdzXYL1ZGouI9TrE7vu0cBTuSCMIw/exec"; 
        let datosGlobales = null;
        let usuarioEmail = '';

        async function intentarLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("Completa los campos");

            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const res = await fetch(`${WEB_APP_URL}?email=${email}&password=${password}`).then(r => r.json());
                if (res.success) {
                    usuarioEmail = email;
                    datosGlobales = res.data;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('sidebar').style.display = 'flex';
                    document.getElementById('contenido').style.display = 'block';
                    mostrarSeccion('Alumno');
                } else { throw new Error(); }
            } catch (e) {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('btnLogin').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
            }
        }

        function coleccionarFilas(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;
            if (typeof data === 'object') {
                if (data.records) return data.records;
                if (data.filas) return data.filas;
                return [data];
            }
            return [];
        }

        function mostrarSeccion(seccion) {
            const container = document.getElementById('datosCuerpo');
            const titulo = document.getElementById('seccionTitulo');
            container.innerHTML = "";
            if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');

            const data = datosGlobales ? datosGlobales[seccion] : null;
            if (!data) {
                titulo.innerText = seccion;
                container.innerHTML = "<p>Sin datos en esta sección.</p>";
                return;
            }

            const filas = coleccionarFilas(data);
            const filtradas = filas.filter(f => f.EMAIL && f.EMAIL.toLowerCase() === usuarioEmail.toLowerCase());

            if (filtradas.length === 0) {
                titulo.innerText = seccion;
                container.innerHTML = "<p>No se encontraron registros para tu cuenta.</p>";
                return;
            }

            titulo.innerText = (seccion === 'Alumno') ? `Hola, ${filtradas[0].ALUMNO}` : seccion;

            filtradas.forEach((fila, idx) => {
                const deck = document.createElement('div');
                deck.className = 'deck-card';
                
                const dTitle = document.createElement('h3');
                dTitle.className = 'deck-title';
                dTitle.textContent = (seccion === 'Abono') ? "Estado de Pagos" : `Registro ${idx + 1}`;
                deck.appendChild(dTitle);

                const deckGrid = document.createElement('div');
                deckGrid.className = 'deck-grid';

                if (seccion === 'Abono') {
                    const cuotas = {}, vencs = {}, otros = {};
                    
                    // Lógica para agrupar Cuotas y Vencimientos
                    for (let campo in fila) {
                        if (campo === 'EMAIL') continue;
                        let valor = fila[campo] || '---';
                        const uCampo = campo.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

                        // Formatear Dinero
                        if (valor !== '---' && ((uCampo.includes('CUOTA') && !uCampo.includes('N°')) || uCampo.includes('VALOR') || uCampo.includes('CERTIFICADO') || uCampo.includes('DESCUENTO'))) {
                            const num = parseFloat(String(valor).replace(/[$.]/g, '').replace(',', '.'));
                            if (!isNaN(num)) valor = num.toLocaleString('es-AR', { style: 'currency', currency: 'ARS' });
                        }

                        // Formatear Fecha
                        if (valor !== '---' && (uCampo.includes('VENCIMIENTO') || uCampo.includes('FECHA'))) {
                            const fecha = new Date(valor);
                            if (!isNaN(fecha.getTime())) {
                                valor = `${String(fecha.getUTCDate()).padStart(2,'0')}/${String(fecha.getUTCMonth()+1).padStart(2,'0')}/${fecha.getUTCFullYear()}`;
                            }
                        }

                        // Clasificar
                        if (uCampo.startsWith('CUOTA ')) {
                            const n = uCampo.split(' ')[1];
                            cuotas[n] = valor;
                        } else if (uCampo.startsWith('VENCIMIENTO')) {
                            const n = uCampo.split(' ')[1] || "1"; // Si es "VENCIMIENTO" solo, es la 1
                            vencs[n] = valor;
                        } else {
                            otros[campo] = valor;
                        }
                    }

                    // Renderizar Mini Tarjetas
                    const mContainer = document.createElement('div');
                    mContainer.className = 'mini-cards-container';
                    for (let i = 1; i <= 6; i++) {
                        if (cuotas[i]) {
                            const mCard = document.createElement('div');
                            mCard.className = 'mini-card';
                            mCard.innerHTML = `
                                <h4>Cuota ${i}</h4>
                                <div class="cuota-valor">${cuotas[i]}</div>
                                <div class="venc-valor">${vencs[i] ? 'Vence: ' + vencs[i] : 'Sin fecha'}</div>
                            `;
                            mContainer.appendChild(mCard);
                        }
                    }
                    deck.appendChild(mContainer);

                    // Resto de la info (Alumno, Plan, etc)
                    const gInfo = document.createElement('div');
                    gInfo.className = 'grid-info';
                    for (let c in otros) {
                        gInfo.innerHTML += `<div class="info-item"><label>${c.replace(/_/g,' ')}</label><span>${otros[c]}</span></div>`;
                    }
                    deck.appendChild(gInfo);

                } else {
                    // Otras secciones (Normal)
                    deckGrid.classList.add('grid-info');
                    for (let campo in fila) {
                        if (campo === 'EMAIL') continue;
                        let valor = fila[campo] || '---';
                        deckGrid.innerHTML += `<div class="info-item"><label>${campo.replace(/_/g,' ')}</label><span>${valor}</span></div>`;
                    }
                    deck.appendChild(deckGrid);
                }
                container.appendChild(deck);
            });
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    </script>
</body>
</html>
