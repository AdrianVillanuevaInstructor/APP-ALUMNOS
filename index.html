<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Control 2.6</title>
    <link rel="icon" href="IT%20INSTITUTE.png" type="image/png">
    <style>
        :root {
            --primary: #5D2E80;
            --secondary: #334155;
            --accent: #5D2E80;
            --bg: #f4f6f9;
            --text: #ffffff;
        }

        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); display: flex; min-height: 100vh; overflow: auto; }

        /* Pantalla de Login */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center; width: 100%; max-width: 350px;
        }
        .login-card h2 { color: var(--primary); margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }
        .login-card button {
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        /* App Layout */
        .sidebar { width: 260px; background: var(--primary); color: white; padding: 20px; display: none; flex-direction: column; }
        .sidebar h2 { font-size: 1.2rem; border-bottom: 1px solid var(--secondary); padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .sidebar button {
            width: 100%; margin: 8px 0; padding: 12px 15px; border: none; background: var(--secondary);
            color: white; cursor: pointer; text-align: left; border-radius: 8px; transition: 0.3s; font-size: 0.9rem;
        }
        .sidebar button:hover { background: var(--accent); }
        .sidebar .logout { margin-top: 10%; background: #ef4444; }

        .content { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        #seccionTitulo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 0.02em;
            color: #5CC6D0;
        }
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1200;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .card { 
            background: white; padding: 25px; margin-bottom: 20px; border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--accent);
        }
        .deck-card {
            background: white;
            border: 1px solid #dbe4f5;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(30, 41, 59, 0.08);
        }
        .deck-title {
            margin: 0 0 14px;
            font-size: 1.05rem;
            color: #5CC6D0;
        }

        /* Responsive mobile */
        @media (max-width: 900px) {
            body { flex-direction: column; min-height: 100vh; overflow: auto; }
            .sidebar {
                position: fixed;
                inset: 0 0 auto 0;
                width: 250px;
                transform: translateX(-100%);
                transition: transform 0.2s ease;
                z-index: 1100;
                overflow-y: auto;
                min-height: 100vh;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .content {
                width: 100%;
                padding: 18px;
                margin-left: 0;
                overflow-y: auto;
            }
            .mobile-menu-btn {
                display: block;
            }
        }

        @media (max-width: 500px) {
            .content { padding: 14px; overflow-y: auto; }
            .info-item { margin-bottom: 8px; }
            .deck-grid { grid-template-columns: 1fr; }
        }
        .deck-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .info-item { margin-bottom: 10px; }
        .info-item label { display: block; font-size: 0.8rem; color: #5CC6D0; font-weight: bold; text-transform: uppercase; }
        .info-item span { font-size: 1rem; color: #1e293b; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>Acceso Alumnos</h2>
            <input type="email" id="emailInput" placeholder="Introduce tu email registrado">
            <input type="password" id="passwordInput" placeholder="Introduce tu contraseña">
            <button onclick="intentarLogin()" id="btnLogin">Ingresar</button>
            <div class="loader" id="loader"></div>
            <p id="errorMsg" style="color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none;">Email o contraseña incorrectos.</p>
        </div>
    </div>

    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()" aria-label="Abrir menú">☰</button>
    <div class="sidebar" id="sidebar">
        <h2>Portal Alumno</h2>
        <button onclick="mostrarSeccion('Alumno')">👤 Mis Datos</button>
        <button onclick="mostrarSeccion('Asistencias')">📅 Asistencias</button>
        <button onclick="mostrarSeccion('Practicas')">🧪 Prácticas</button>
        <button onclick="mostrarSeccion('Recuperaciones')">🔄 Recuperaciones</button>
        <button onclick="mostrarSeccion('Abono')">💰 Mis Pagos</button>
        <button class="logout" onclick="location.reload()">Cerrar Sesión</button>
    </div>

    <div class="content" id="contenido">
        <h1 id="seccionTitulo">Bienvenido</h1>
        <div id="datosCuerpo" class="grid-info">
            </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZlly9kkBOJE2kAl0xgTQTflWrEggTcghjD30otGdzXYL1ZGouI9TrE7vu0cBTuSCMIw/exec"; 
        let datosGlobales = null;
        let usuarioEmail = '';

        async function intentarLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("Ingresa tu email y contraseña");

            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';

            try {
                // Llamada a Google Sheets usando fetch (JSONP o CORS depende de la implementación)
                // Para Vercel -> Google Apps Script, usaremos una petición simple
                const response = await fetch(`${WEB_APP_URL}?email=${email}&password=${password}`);
                // Nota: Por seguridad y CORS, Apps Script se maneja mejor con google.script.run si está dentro, 
                // pero como es para Vercel, el Apps Script debe aceptar parámetros GET.
                
                // --- SIMULACIÓN DE RESPUESTA PARA PRUEBAS (En producción usa el fetch real) ---
                // Para que funcione el fetch real, el Apps Script debe devolver un ContentService.JSON
                
                // Aquí usamos una técnica de "puente". Para este ejemplo, llamaremos al servidor:
                const res = await fetch(`${WEB_APP_URL}?email=${email}&password=${password}`).then(r => r.json());

                if (res.success) {
                    usuarioEmail = email;
                    datosGlobales = res.data;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('sidebar').style.display = 'flex';
                    document.getElementById('contenido').style.display = 'block';
                    mostrarSeccion('Alumno');
                } else {
                    throw new Error();
                }
            } catch (e) {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('btnLogin').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
            }
        }

        function coleccionarFilas(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;

            if (typeof data === 'object' && data !== null) {
                // Google Apps Script puede retornar un objeto con arrays por columna
                const keys = Object.keys(data);
                const values = keys.map(k => data[k]);
                if (values.every(v => Array.isArray(v))) {
                    const maxLen = Math.max(...values.map(v => v.length));
                    const rows = [];
                    for (let i = 0; i < maxLen; i++) {
                        const row = {};
                        keys.forEach(key => {
                            row[key] = data[key][i] !== undefined ? data[key][i] : '';
                        });
                        rows.push(row);
                    }
                    return rows;
                }
                // Ver si está empaquetado en propiedades comunes
                if (Array.isArray(data.records)) return data.records;
                if (Array.isArray(data.filas)) return data.filas;

                // Caso normal: único objeto = un registro
                return [data];
            }

            return [];
        }

        function mostrarSeccion(seccion) {
            const container = document.getElementById('datosCuerpo');
            const titulo = document.getElementById('seccionTitulo');
            container.innerHTML = "";

            const data = datosGlobales ? datosGlobales[seccion] : null;
            if (!data) {
                titulo.innerText = seccion;
                container.innerHTML = "<p>No hay datos registrados en esta sección.</p>";
                return;
            }

            const filas = coleccionarFilas(data);
            const filasFiltradas = filas.filter(fila => {
                if (usuarioEmail && fila && fila.EMAIL) {
                    return String(fila.EMAIL).trim().toLowerCase() === String(usuarioEmail).trim().toLowerCase();
                }
                return true;
            });

            if (filasFiltradas.length === 0) {
                titulo.innerText = seccion;
                container.innerHTML = "<p>No hay registros que coincidan con tu email.</p>";
                return;
            }

            const firstRow = filasFiltradas[0];
            if (seccion === 'Alumno' && firstRow && firstRow.ALUMNO) {
                titulo.innerText = `Hola, ${firstRow.ALUMNO}`;
            } else {
                titulo.innerText = seccion;
            }

            filasFiltradas.forEach((fila, index) => {
                const deck = document.createElement('div');
                deck.className = 'deck-card';
                if (window.innerWidth <= 900) {
                    document.getElementById('sidebar').classList.remove('open');
                }

                const deckTitle = document.createElement('h3');
                deckTitle.className = 'deck-title';
                deckTitle.textContent = `Curso ${index + 1}`;
                deck.appendChild(deckTitle);

                const deckGrid = document.createElement('div');
                deckGrid.className = 'deck-grid';

                    for (let campo in fila) {
                    if (campo === 'EMAIL') continue;

                    let valor = fila[campo] || '---';
                    const key = campo.toUpperCase();
                    const keySinAcentos = key.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    if (valor !== '---' && (keySinAcentos.includes('RECUPERACION') || keySinAcentos.includes('FECHA'))) {
                        const fecha = new Date(valor);
                        if (!isNaN(fecha.getTime())) {
                            const dia = String(fecha.getUTCDate()).padStart(2, '0');
                            const mes = String(fecha.getUTCMonth() + 1).padStart(2, '0');
                            const anio = fecha.getUTCFullYear();
                            valor = `${dia}/${mes}/${anio}`;
                        }
                    }

                    // Formatear como dinero en sección Abono (Pagos)
                    if (seccion === 'Abono' && valor !== '---') {
                        const camposDinero = ['VALOR', 'PAGO ANTES DEL 10', 'CERTIFICADO', 'CUOTA 1', 'CUOTA 2', 'CUOTA 3', 'CUOTA 4', 'CUOTA 5', 'CUOTA 6'];
                        if (camposDinero.includes(campo.toUpperCase())) {
                            const num = parseFloat(valor);
                            if (!isNaN(num)) {
                                valor = num.toLocaleString('es-CO', { style: 'currency', currency: 'COP' });
                            }
                        }
                    }

                    const info = document.createElement('div');
                    info.className = 'info-item';

                    let labelText = campo.replace(/_/g, ' ');
                    let spanElement;

                    if (seccion === 'Alumno' && campo.toUpperCase() === 'CONTRASEÑA') {
                        // Campo especial para contraseña
                        spanElement = document.createElement('span');
                        spanElement.textContent = '********';
                        spanElement.dataset.realValue = valor;
                        spanElement.dataset.hidden = 'true';
                        spanElement.style.cursor = 'pointer';
                        spanElement.onclick = function() {
                            if (this.dataset.hidden === 'true') {
                                this.textContent = this.dataset.realValue;
                                this.dataset.hidden = 'false';
                            } else {
                                this.textContent = '********';
                                this.dataset.hidden = 'true';
                            }
                        };
                    } else {
                        spanElement = document.createElement('span');
                        spanElement.textContent = valor;
                    }

                    info.innerHTML = `<label>${labelText}</label>`;
                    info.appendChild(spanElement);
                    deckGrid.appendChild(info);
                }

                deck.appendChild(deckGrid);
                container.appendChild(deck);
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }
    </script>
</body>
</html>
